<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Erica's Lab 04 Webpage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Lab 04</h1>

    <button id="colorBtn">Change Background Color</button>

    <p>Visit one of my favorite websites:
        <a href="https://www.epcc.edu" target="_blank">El Paso Community College</a>
    </p>

    <div class="steps">
        <h2>How to Order Snacks</h2>
        <ol>
            <li>Browse the menu</li>
            <li>Select your favorite snack</li>
            <li>Place order by message</li>
            <li>Enjoy your snacks!</li>
        </ol>
    </div>

    <div class="snacks">
        <h2>My Favorite Snacks</h2>
        <ul>
            <li>Strawberries</li>
            <li>Yogurt</li>
            <li>Granola bars</li>
        </ul>
    </div>

    <div class="image-section">
        <h2>My Image</h2>
        <img src="Sunset.jpg" alt="Sunset">
    </div>

    <script>
        const btn = document.getElementById("colorBtn");

        btn.addEventListener("click", function() {
            const randomColor = "#" + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        });
    </script>
</body>
</html>
